name: SomnaLux TestFlight Cloud Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build Description / TestFlight Release Notes'
        required: false
        default: 'Automated TestFlight build for SomnaLux'

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 🍏 Compile, Archive & Deliver to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 16.x (iOS 18+ SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.3.0.app || sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version
          swift --version

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: 🔄 Sync SomnaLux.xcodeproj for Apple Xcode Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f SomnaLux.xcodeproj
          if git commit -m "chore: auto-sync SomnaLux.xcodeproj for Apple Xcode Cloud & TestFlight [skip ci]"; then
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s\n" "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ App Store Connect API Key installed safely."

      - name: 🧪 Validate Apple API Key Connection
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          echo "Testing connection to Apple App Store Connect servers..."
          xcrun altool --list-apps \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 🚀 Archive Release Candidate for TestFlight
        run: |
          mkdir -p build
          echo "Archiving SomnaLux target for generic iOS device (Build #${{ github.run_number }})..."
          xcodebuild archive \
            -project SomnaLux.xcodeproj \
            -scheme SomnaLux \
            -configuration Release \
            -archivePath build/SomnaLux.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📤 Export & Deliver to TestFlight via Apple Direct Upload
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          mkdir -p build/output
          echo "Uploading archive directly to App Store Connect via native xcodebuild distribution..."
          xcodebuild -exportArchive \
            -archivePath build/SomnaLux.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✓ Native xcodebuild upload completed!"

      - name: 🗂️ Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: somnalux-testflight-logs
          path: |
            build/*.xcarchive
            ~/.appstoreconnect/*.log
          retention-days: 7
