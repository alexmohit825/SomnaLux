name: iOS Build & Xcode Cloud Sync

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build iOS Simulator & Xcode Cloud Sync
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Sync Xcode Project to Repo for Apple Xcode Cloud
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f SomnaLux.xcodeproj
          if git commit -m "chore: auto-sync SomnaLux.xcodeproj at root for Apple Xcode Cloud"; then
            git push origin main
          fi

      - name: Validate Build on iOS Simulator
        run: |
          xcodebuild build \
            -project SomnaLux.xcodeproj \
            -scheme SomnaLux \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
